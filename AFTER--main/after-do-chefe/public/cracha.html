<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crachá — Êxtase Fest</title>
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0d0d0d; color: #fff;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: 2rem 1rem 3rem;
    }

    /* ── FORMULÁRIO DE GERAÇÃO ── */
    .form-card {
      width: 100%; max-width: 420px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px; padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .form-title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 16px; font-weight: 700;
      color: rgba(255,255,255,.7); margin-bottom: 1rem;
    }
    .form-row { display: flex; flex-direction: column; gap: .5rem; margin-bottom: .75rem; }
    .form-label { font-size: 11px; font-weight: 600; color: rgba(255,255,255,.35); text-transform: uppercase; letter-spacing: .08em; }
    .form-input, .form-select {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px; padding: 10px 14px;
      color: #fff; font-size: 14px; font-family: 'DM Sans', sans-serif;
      outline: none; transition: border-color .15s;
    }
    .form-input:focus, .form-select:focus { border-color: rgba(168,85,247,.5); }
    .form-select option { background: #1a0028; }
    .btn-gerar {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, #A855F7, #6D28D9);
      border: none; border-radius: 12px;
      color: #fff; font-size: 14px; font-weight: 700;
      font-family: 'Bricolage Grotesque', sans-serif;
      cursor: pointer; transition: opacity .15s; margin-top: .25rem;
    }
    .btn-gerar:hover { opacity: .85; }

    /* ── LABEL PREVIEW ── */
    .preview-label {
      font-size: 11px; font-weight: 600;
      color: rgba(255,255,255,.25);
      text-transform: uppercase; letter-spacing: .1em;
      margin-bottom: 1rem;
    }

    /* ── BADGE — 88mm × 125mm @ 96dpi ≈ 332px × 472px ── */
    .badge {
      width: 332px; height: 472px;
      background: #06000F;
      border-radius: 18px;
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center;
      border: 1px solid rgba(168,85,247,.2);
    }

    /* variantes de cor */
    .badge.staff   { --accent: #A855F7; --accent2: #6D28D9; --glow: rgba(168,85,247,.45); --text-accent: #C084FC; }
    .badge.imprensa { --accent: #06B6D4; --accent2: #0284C7; --glow: rgba(6,182,212,.4); --text-accent: #67E8F9; }

    .badge { box-shadow: 0 0 60px var(--glow, rgba(168,85,247,.4)), 0 24px 60px rgba(0,0,0,.7); }

    /* furo de cordão */
    .lanyard-hole {
      position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      width: 20px; height: 20px; border-radius: 50%;
      background: #0d0d0d;
      border: 2px solid rgba(255,255,255,.12); z-index: 10;
    }

    /* fundo */
    .bg-glow {
      position: absolute; border-radius: 50%;
      filter: blur(70px); pointer-events: none;
    }
    .bg-glow.g1 {
      width: 220px; height: 220px;
      top: -70px; left: -70px; opacity: .35;
      background: radial-gradient(circle, var(--accent), transparent);
    }
    .bg-glow.g2 {
      width: 160px; height: 160px;
      bottom: -50px; right: -50px; opacity: .25;
      background: radial-gradient(circle, var(--accent2), transparent);
    }
    .bg-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(168,85,247,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168,85,247,.03) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    /* cantos decorativos */
    .corner { position: absolute; width: 22px; height: 22px; z-index: 4; }
    .corner-tl { top: 10px; left: 10px; border-top: 1.5px solid var(--accent); border-left: 1.5px solid var(--accent); border-radius: 3px 0 0 0; opacity: .6; }
    .corner-tr { top: 10px; right: 10px; border-top: 1.5px solid var(--accent); border-right: 1.5px solid var(--accent); border-radius: 0 3px 0 0; opacity: .6; }
    .corner-bl { bottom: 10px; left: 10px; border-bottom: 1.5px solid var(--accent); border-left: 1.5px solid var(--accent); border-radius: 0 0 0 3px; opacity: .6; }
    .corner-br { bottom: 10px; right: 10px; border-bottom: 1.5px solid var(--accent); border-right: 1.5px solid var(--accent); border-radius: 0 0 3px 0; opacity: .6; }

    /* faixa topo */
    .top-stripe {
      width: 100%; height: 32px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      position: relative; z-index: 5;
    }
    .top-stripe-text {
      font-size: 8px; font-weight: 700;
      color: rgba(255,255,255,.85);
      letter-spacing: .22em; text-transform: uppercase;
    }

    /* conteúdo */
    .badge-content {
      position: relative; z-index: 5;
      display: flex; flex-direction: column;
      align-items: center;
      flex: 1; width: 100%;
      padding: 18px 20px 14px;
    }

    /* nome do evento */
    .event-name {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 36px; font-weight: 800;
      letter-spacing: -1.5px; line-height: 1;
      background: linear-gradient(180deg, #fff 0%, var(--text-accent) 50%, var(--accent) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 24px var(--glow));
      margin-bottom: 2px;
    }
    .event-sub {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 10px; font-weight: 700;
      letter-spacing: .4em; text-transform: uppercase;
      color: rgba(255,255,255,.3);
      margin-bottom: 14px;
    }

    /* divider */
    .divider {
      width: 75%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: .4; margin-bottom: 14px;
    }

    /* avatar de iniciais */
    .avatar {
      width: 68px; height: 68px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      box-shadow: 0 0 28px var(--glow);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 26px; font-weight: 800; color: #fff;
      margin-bottom: 12px; flex-shrink: 0;
      text-shadow: 0 1px 6px rgba(0,0,0,.4);
    }

    /* pill de cargo */
    .cargo-pill {
      display: inline-flex; align-items: center; gap: 5px;
      border-radius: 999px; padding: 5px 14px;
      font-size: 10px; font-weight: 800;
      letter-spacing: .18em; text-transform: uppercase;
      background: rgba(255,255,255,.06);
      border: 1.5px solid var(--accent);
      color: var(--text-accent);
      box-shadow: 0 0 14px rgba(0,0,0,.3);
      margin-bottom: 12px;
    }
    .cargo-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
    }

    /* nome da pessoa */
    .badge-nome {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 22px; font-weight: 800;
      text-align: center; line-height: 1.15; color: #fff;
      word-break: break-word; max-width: 100%;
      margin-bottom: 8px;
    }

    /* info evento */
    .badge-meta {
      font-size: 10px; color: rgba(255,255,255,.3);
      text-align: center; line-height: 1.5;
    }

    /* rodapé */
    .badge-footer {
      margin-top: auto; width: 100%;
      border-top: 1px solid rgba(255,255,255,.06);
      padding-top: 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-insta {
      font-size: 9px; color: rgba(255,255,255,.2);
      font-weight: 600; letter-spacing: .05em;
    }
    .footer-date {
      font-size: 9px; color: rgba(255,255,255,.2);
      font-weight: 600;
    }

    /* ── AÇÕES ── */
    .actions {
      display: flex; gap: .75rem; margin-top: 1.5rem;
      flex-wrap: wrap; justify-content: center;
    }
    .btn-action {
      padding: 12px 22px; border-radius: 12px;
      font-size: 13px; font-weight: 700; cursor: pointer; border: none;
      font-family: 'Bricolage Grotesque', sans-serif;
      transition: opacity .15s;
    }
    .btn-action:hover { opacity: .85; }
    .btn-imprimir { background: linear-gradient(135deg, #A855F7, #6D28D9); color: #fff; }
    .btn-link {
      background: rgba(255,255,255,.07);
      border: 1.5px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.5);
    }

    /* ── IMPRESSÃO ── */
    @media print {
      @page {
        size: 88mm 125mm;
        margin: 0;
      }
      body {
        background: #06000F; padding: 0; margin: 0;
        display: block; min-height: unset;
      }
      .form-card, .preview-label, .actions { display: none !important; }
      .badge {
        width: 88mm !important; height: 125mm !important;
        border-radius: 6mm !important;
        box-shadow: none !important;
        page-break-inside: avoid;
        margin: 0; border: none;
      }
      .bg-glow { display: none !important; }
      .lanyard-hole { display: none !important; }
    }
  </style>
</head>
<body>

<!-- FORMULÁRIO -->
<div class="form-card" id="form-card">
  <div class="form-title">Gerar crachá</div>
  <div class="form-row">
    <label class="form-label">Nome completo</label>
    <input class="form-input" id="input-nome" type="text" placeholder="Ex: João da Silva" maxlength="40">
  </div>
  <div class="form-row">
    <label class="form-label">Cargo</label>
    <select class="form-select" id="input-cargo">
      <option value="staff">Staff</option>
      <option value="imprensa">Imprensa</option>
    </select>
  </div>
  <button class="btn-gerar" onclick="gerarCracha()">Gerar crachá</button>
</div>

<!-- PREVIEW -->
<div class="preview-label" id="preview-label">Pré-visualização</div>

<div class="badge" id="badge">
  <div class="lanyard-hole"></div>
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>
  <div class="bg-grid"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="top-stripe">
    <span class="top-stripe-text">ÊXTASE FEST &nbsp;•&nbsp; 06 JUN 2026</span>
  </div>

  <div class="badge-content">
    <div class="event-name">ÊXTASE</div>
    <div class="event-sub">FEST</div>

    <div class="divider"></div>

    <div class="avatar" id="avatar-initials">?</div>

    <div class="cargo-pill">
      <div class="cargo-dot"></div>
      <span id="cargo-label">STAFF</span>
    </div>

    <div class="badge-nome" id="nome-display">Nome Completo</div>

    <div class="badge-meta">
      06 de Junho de 2026<br>Quadra 8 de Sobradinho
    </div>

    <div class="badge-footer">
      <span class="footer-insta">@extasefest</span>
      <span class="footer-date">06/06/2026</span>
    </div>
  </div>
</div>

<div class="actions">
  <button class="btn-action btn-imprimir" onclick="window.print()">Imprimir crachá</button>
  <button class="btn-action btn-link" id="btn-copiar" onclick="copiarLink()">Copiar link</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);

function aplicar(nome, cargo) {
  const badge = document.getElementById('badge');
  const nomeEl = document.getElementById('nome-display');
  const avatarEl = document.getElementById('avatar-initials');
  const cargoEl = document.getElementById('cargo-label');

  badge.classList.remove('staff', 'imprensa');

  const isImprensa = cargo === 'imprensa';
  badge.classList.add(isImprensa ? 'imprensa' : 'staff');
  cargoEl.textContent = isImprensa ? 'IMPRENSA' : 'STAFF';

  nomeEl.textContent = nome || 'Nome Completo';
  const iniciais = (nome || '?').trim().split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
  avatarEl.textContent = iniciais || '?';

  document.getElementById('input-nome').value = nome;
  document.getElementById('input-cargo').value = cargo;
}

function gerarCracha() {
  const nome = document.getElementById('input-nome').value.trim();
  const cargo = document.getElementById('input-cargo').value;
  if (!nome) { document.getElementById('input-nome').focus(); return; }
  const url = new URL(window.location.href);
  url.searchParams.set('nome', nome);
  url.searchParams.set('cargo', cargo);
  history.replaceState(null, '', url.toString());
  aplicar(nome, cargo);
}

function copiarLink() {
  navigator.clipboard.writeText(window.location.href).catch(() => {});
  const btn = document.getElementById('btn-copiar');
  btn.textContent = 'Link copiado!';
  setTimeout(() => { btn.textContent = 'Copiar link'; }, 2000);
}

// atualização ao vivo
document.getElementById('input-nome').addEventListener('input', () => {
  const nome = document.getElementById('input-nome').value.trim();
  const cargo = document.getElementById('input-cargo').value;
  aplicar(nome || 'Nome Completo', cargo);
});
document.getElementById('input-cargo').addEventListener('change', () => {
  const nome = document.getElementById('input-nome').value.trim();
  const cargo = document.getElementById('input-cargo').value;
  aplicar(nome || 'Nome Completo', cargo);
});
document.getElementById('input-nome').addEventListener('keydown', e => {
  if (e.key === 'Enter') gerarCracha();
});

// carregar da URL ao abrir
const nomeParam = params.get('nome') || '';
const cargoParam = (params.get('cargo') || 'staff').toLowerCase();
aplicar(nomeParam, cargoParam);
</script>
</body>
</html>
