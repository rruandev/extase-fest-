<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Êxtase Fest — Capa do Grupo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#111;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  gap:20px;
  font-family:'DM Sans',sans-serif;
  padding:20px;
}

/* ── CAPA ── */
.capa{
  width:500px;
  height:500px;
  background:#06000F;
  position:relative;
  overflow:hidden;
  border-radius:16px;
  box-shadow:0 0 80px rgba(168,85,247,.5),0 0 160px rgba(168,85,247,.15);
}

/* GLOWS */
.glow{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
.g1{width:350px;height:350px;background:radial-gradient(circle,rgba(168,85,247,.55),transparent);top:-100px;left:-80px;animation:drift1 8s ease-in-out infinite}
.g2{width:300px;height:300px;background:radial-gradient(circle,rgba(109,40,217,.45),transparent);bottom:-80px;right:-70px;animation:drift2 10s ease-in-out infinite}
.g3{width:200px;height:200px;background:radial-gradient(circle,rgba(192,132,252,.3),transparent);top:50%;left:50%;transform:translate(-50%,-50%);animation:pulsebg 5s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(25px,20px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,-25px)}}
@keyframes pulsebg{0%,100%{opacity:.3;transform:translate(-50%,-50%) scale(1)}50%{opacity:.7;transform:translate(-50%,-50%) scale(1.5)}}

/* GRID */
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(168,85,247,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(168,85,247,.04) 1px,transparent 1px);background-size:30px 30px}

/* SCANLINES */
.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.07) 3px,rgba(0,0,0,.07) 4px);pointer-events:none}

/* BORDA ANIMADA */
.border-glow{
  position:absolute;inset:0;
  border-radius:16px;
  padding:2px;
  background:linear-gradient(135deg,rgba(168,85,247,.6),rgba(109,40,217,.2),rgba(192,132,252,.6),rgba(109,40,217,.2),rgba(168,85,247,.6));
  background-size:300% 300%;
  animation:bordermove 4s linear infinite;
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
}
@keyframes bordermove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* PARTICLES */
.particles{position:absolute;inset:0;overflow:hidden}
.p{position:absolute;border-radius:50%;animation:pfloat linear infinite}
.p:nth-child(1){width:3px;height:3px;background:#A855F7;left:15%;top:95%;animation-duration:5s;animation-delay:0s}
.p:nth-child(2){width:2px;height:2px;background:#C084FC;left:40%;top:95%;animation-duration:7s;animation-delay:1.2s}
.p:nth-child(3){width:4px;height:4px;background:#7C3AED;left:65%;top:95%;animation-duration:6s;animation-delay:2.5s}
.p:nth-child(4){width:2px;height:2px;background:#A855F7;left:80%;top:95%;animation-duration:8s;animation-delay:.8s}
.p:nth-child(5){width:3px;height:3px;background:#C084FC;left:28%;top:95%;animation-duration:5.5s;animation-delay:3s}
@keyframes pfloat{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:.3}100%{transform:translateY(-520px);opacity:0}}

/* SMILEYS */
.smileys{position:absolute;inset:0;overflow:hidden}
.smiley{position:absolute;opacity:.08;animation:smileyfloat ease-in-out infinite}
@keyframes smileyfloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(8deg)}}

/* CONTEÚDO */
.content{
  position:relative;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  height:100%;gap:0;
}

.tag{
  font-size:10px;font-weight:700;
  letter-spacing:.25em;text-transform:uppercase;
  color:rgba(192,132,252,.55);
  margin-bottom:18px;
  display:flex;align-items:center;gap:8px;
}
.tag::before,.tag::after{content:'';display:inline-block;width:28px;height:1px;background:rgba(168,85,247,.4)}

.title-main{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:108px;font-weight:800;letter-spacing:-5px;line-height:.82;
  background:linear-gradient(180deg,#fff 0%,#C084FC 45%,#A855F7 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 40px rgba(168,85,247,.7));
  animation:titlepulse 3s ease-in-out infinite;
  text-align:center;
}
@keyframes titlepulse{0%,100%{filter:drop-shadow(0 0 25px rgba(168,85,247,.5))}50%{filter:drop-shadow(0 0 60px rgba(168,85,247,1))}}

.divider{
  width:140px;height:2px;
  background:linear-gradient(90deg,transparent,#A855F7,#C084FC,#A855F7,transparent);
  margin:14px 0;
}

.title-sub{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:46px;font-weight:800;letter-spacing:.45em;
  background:linear-gradient(90deg,#7C3AED,#A855F7,#C084FC,#A855F7,#7C3AED);
  background-size:200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:shimmer 3s linear infinite;
}
@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}

.info-row{
  display:flex;align-items:center;gap:14px;
  margin-top:18px;
}
.info-pill{
  background:rgba(168,85,247,.12);
  border:1px solid rgba(168,85,247,.3);
  border-radius:20px;
  padding:6px 14px;
  font-size:12px;font-weight:700;
  color:rgba(192,132,252,.85);
  letter-spacing:.04em;
}
.info-dot{width:4px;height:4px;border-radius:50%;background:rgba(168,85,247,.4)}

.bottom-bar{
  position:absolute;bottom:0;left:0;right:0;
  padding:14px 24px;
  background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);
  display:flex;align-items:center;justify-content:space-between;
  z-index:11;
}
.insta{font-size:12px;font-weight:700;color:rgba(192,132,252,.6);letter-spacing:.05em}
.insta span{color:rgba(168,85,247,.9)}
.grupo-tag{
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.2);
}

/* HINT */
.hint{
  color:rgba(255,255,255,.2);
  font-size:12px;text-align:center;
  max-width:400px;line-height:1.6;
}
.hint strong{color:rgba(168,85,247,.6)}

@media print{
  body{background:#06000F;padding:0;min-height:unset;gap:0}
  .capa{border-radius:0;box-shadow:none}
  .hint{display:none}
}
</style>
</head>
<body>

<div class="capa">
  <!-- FUNDOS -->
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>
  <div class="bg-grid"></div>
  <div class="scanlines"></div>
  <div class="border-glow"></div>

  <!-- SMILEYS DE FUNDO -->
  <div class="smileys" id="smileys"></div>

  <!-- PARTICLES -->
  <div class="particles">
    <div class="p"></div><div class="p"></div>
    <div class="p"></div><div class="p"></div>
    <div class="p"></div>
  </div>

  <!-- CONTEÚDO -->
  <div class="content">
    <div class="tag">evento oficial</div>

    <div class="title-main">ÊXTASE</div>
    <div class="divider"></div>
    <div class="title-sub">FEST</div>

    <div class="info-row">
      <div class="info-pill">06 • 06 • 2026</div>
      <div class="info-dot"></div>
      <div class="info-pill">21h30</div>
      <div class="info-dot"></div>
      <div class="info-pill">+18</div>
    </div>
  </div>

  <!-- RODAPÉ -->
  <div class="bottom-bar">
    <div class="insta">📸 <span>@extasefest</span></div>
    <div class="grupo-tag">grupo oficial</div>
  </div>
</div>

<p class="hint">
  Tire um <strong>print da tela</strong> e recorte no quadrado<br>
  ou pressione <strong>Ctrl+P → Salvar como PDF</strong> e converta em imagem
</p>

<script>
// Smileys de fundo
(function(){
  const c = document.getElementById('smileys');
  const cor = ['#A855F7','#C084FC','#7C3AED','#9333EA'];
  const dados = [
    {s:55,x:8,y:12,d:0,dur:7},{s:38,x:72,y:8,d:1.5,dur:9},
    {s:46,x:55,y:68,d:3,dur:8},{s:30,x:20,y:75,d:.8,dur:6},
    {s:42,x:82,y:52,d:2,dur:10},{s:35,x:40,y:22,d:4,dur:7.5}
  ];
  dados.forEach(({s,x,y,d,dur},i)=>{
    const col = cor[i%cor.length];
    const el = document.createElement('div');
    el.className='smiley';
    el.style.cssText=`left:${x}%;top:${y}%;width:${s}px;height:${s}px;animation-duration:${dur}s;animation-delay:${d}s`;
    el.innerHTML=`<svg width="${s}" height="${s}" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="${col}" stroke-width="5"/>
      <line x1="28" y1="32" x2="38" y2="42" stroke="${col}" stroke-width="6" stroke-linecap="round"/>
      <line x1="38" y1="32" x2="28" y2="42" stroke="${col}" stroke-width="6" stroke-linecap="round"/>
      <line x1="62" y1="32" x2="72" y2="42" stroke="${col}" stroke-width="6" stroke-linecap="round"/>
      <line x1="72" y1="32" x2="62" y2="42" stroke="${col}" stroke-width="6" stroke-linecap="round"/>
      <path d="M32 64 Q50 82 68 64" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round"/>
    </svg>`;
    c.appendChild(el);
  });
})();
</script>
</body>
</html>
