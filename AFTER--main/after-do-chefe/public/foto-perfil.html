<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Êxtase Fest — Foto de Perfil</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;font-family:'DM Sans',sans-serif}

.avatar{
  width:500px;height:500px;
  border-radius:50%;
  background:#06000F;
  position:relative;
  overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 0 60px rgba(168,85,247,.4),0 0 120px rgba(168,85,247,.15);
  border:3px solid rgba(168,85,247,.3);
}

/* FUNDOS */
.bg-glow{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}
.g1{width:300px;height:300px;background:radial-gradient(circle,rgba(168,85,247,.5),transparent);top:-80px;left:-60px;animation:drift1 7s ease-in-out infinite}
.g2{width:250px;height:250px;background:radial-gradient(circle,rgba(109,40,217,.4),transparent);bottom:-60px;right:-50px;animation:drift2 9s ease-in-out infinite}
.g3{width:180px;height:180px;background:radial-gradient(circle,rgba(192,132,252,.25),transparent);top:50%;left:50%;transform:translate(-50%,-50%);animation:pulse-bg 4s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,15px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-15px,-20px)}}
@keyframes pulse-bg{0%,100%{opacity:.4;transform:translate(-50%,-50%) scale(1)}50%{opacity:.8;transform:translate(-50%,-50%) scale(1.4)}}

.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(168,85,247,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(168,85,247,.05) 1px,transparent 1px);background-size:28px 28px}

/* PARTICLES */
.particles{position:absolute;inset:0;overflow:hidden}
.p{position:absolute;border-radius:50%;animation:pfloat linear infinite}
.p:nth-child(1){width:3px;height:3px;background:#A855F7;left:20%;top:80%;animation-duration:5s;animation-delay:0s}
.p:nth-child(2){width:2px;height:2px;background:#C084FC;left:50%;top:85%;animation-duration:7s;animation-delay:1s}
.p:nth-child(3){width:3px;height:3px;background:#7C3AED;left:75%;top:78%;animation-duration:6s;animation-delay:2s}
.p:nth-child(4){width:2px;height:2px;background:#A855F7;left:35%;top:90%;animation-duration:8s;animation-delay:.5s}
@keyframes pfloat{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:.4}100%{transform:translateY(-520px);opacity:0}}

/* CONTEUDO */
.content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px}

.top-deco{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.deco-dot{width:5px;height:5px;border-radius:50%;background:#A855F7;animation:blink 2s ease-in-out infinite}
.deco-dot:nth-child(2){animation-delay:.3s}
.deco-dot:nth-child(3){animation-delay:.6s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

.title-main{font-family:'Bricolage Grotesque',sans-serif;font-size:100px;font-weight:800;letter-spacing:-4px;line-height:.85;background:linear-gradient(180deg,#fff 0%,#C084FC 50%,#A855F7 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 30px rgba(168,85,247,.6));animation:pulse 3s ease-in-out infinite;text-align:center}
.title-sub{font-family:'Bricolage Grotesque',sans-serif;font-size:42px;font-weight:800;letter-spacing:.4em;background:linear-gradient(90deg,#7C3AED,#A855F7,#C084FC,#A855F7,#7C3AED);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 3s linear infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 20px rgba(168,85,247,.4))}50%{filter:drop-shadow(0 0 50px rgba(168,85,247,.9))}}
@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}

.divider{width:120px;height:2px;background:linear-gradient(90deg,transparent,#A855F7,transparent);margin:10px 0}

.date-text{font-size:13px;font-weight:700;color:rgba(192,132,252,.7);letter-spacing:.12em;text-transform:uppercase}

/* HINT */
.hint{color:rgba(255,255,255,.25);font-size:12px;text-align:center;max-width:300px;line-height:1.5}
.hint strong{color:rgba(168,85,247,.6)}

@media print{
  body{background:#06000F;padding:0;min-height:unset}
  .avatar{box-shadow:none}
  .hint{display:none}
}
</style>
</head>
<body>

<div class="avatar">
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>
  <div class="bg-glow g3"></div>
  <div class="bg-grid"></div>
  <div class="particles">
    <div class="p"></div><div class="p"></div>
    <div class="p"></div><div class="p"></div>
  </div>

  <div class="content">
    <div class="top-deco">
      <div class="deco-dot"></div>
      <div class="deco-dot"></div>
      <div class="deco-dot"></div>
    </div>
    <div class="title-main">ÊF</div>
    <div class="divider"></div>
    <div class="title-sub">FEST</div>
    <div class="date-text">06 • 06 • 2026</div>
  </div>
</div>

<p class="hint">Tire um <strong>print da tela</strong> e corte no círculo<br>ou pressione <strong>Ctrl+P → Salvar como PDF</strong></p>

</body>
</html>
