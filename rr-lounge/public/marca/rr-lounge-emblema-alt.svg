<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#181613"/>
      <stop offset="55%" stop-color="#0d0c0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7E7B0"/>
      <stop offset="22%" stop-color="#E7C873"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="72%" stop-color="#9C7A2E"/>
      <stop offset="100%" stop-color="#D8B45E"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a5f28"/>
      <stop offset="50%" stop-color="#E7C873"/>
      <stop offset="100%" stop-color="#7a5f28"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1000" height="1000" fill="url(#bg)"/>

  <!-- art-deco double ring -->
  <circle cx="500" cy="500" r="468" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="500" cy="500" r="448" fill="none" stroke="url(#gold)" stroke-width="1.4" opacity="0.85"/>

  <!-- corner diamond accents on ring (top / bottom / left / right) -->
  <g fill="url(#gold)">
    <rect x="491" y="449" width="18" height="18" transform="rotate(45 500 458)"/>
    <rect x="491" y="533" width="18" height="18" transform="rotate(45 500 542)"/>
    <rect x="449" y="491" width="18" height="18" transform="rotate(45 458 500)"/>
    <rect x="533" y="491" width="18" height="18" transform="rotate(45 542 500)"/>
  </g>

  <!-- interlocking RR monogram (left R mirrored across x=500) -->
  <g fill="url(#gold)">
    <text x="512" y="470" font-family="Cinzel" font-weight="900" font-size="330"
          text-anchor="start" letter-spacing="-6">R</text>
    <g transform="translate(1000,0) scale(-1,1)">
      <text x="512" y="470" font-family="Cinzel" font-weight="900" font-size="330"
            text-anchor="start" letter-spacing="-6">R</text>
    </g>
  </g>

  <!-- divider under monogram -->
  <rect x="330" y="602" width="340" height="2.4" fill="url(#goldLine)"/>
  <rect x="497" y="596" width="14" height="14" transform="rotate(45 504 603)" fill="url(#gold)"/>

  <!-- wordmark -->
  <text x="500" y="688" font-family="Cinzel" font-weight="700" font-size="86"
        text-anchor="middle" letter-spacing="14" fill="url(#gold)">LOUNGE</text>

  <!-- tagline -->
  <text x="500" y="742" font-family="Playfair Display" font-style="italic" font-weight="500"
        font-size="30" text-anchor="middle" letter-spacing="6" fill="#cdb985">Sobradinho &#183; DF</text>
</svg>
